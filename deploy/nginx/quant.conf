# quant.devpilotx.com — TLS termination + routing
# /            -> Next.js frontend
# /api, /ws    -> FastAPI (REST + websocket hub)
# /dbadmin     -> pgweb (DB admin; same session cookie is NOT enough — pgweb
#                 has no auth of its own, so it is additionally IP-gated below)
# /api/webhooks/angelone is rate-limited separately.

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=60r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name quant.devpilotx.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name quant.devpilotx.com;

    ssl_certificate     /etc/letsencrypt/live/quant.devpilotx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quant.devpilotx.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 2m;

    location /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params_qs;
    }

    location /api/webhooks/ {
        limit_req zone=webhook burst=30 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params_qs;
    }

    location /api/ {
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params_qs;
    }

    location /ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /dbadmin {
        # pgweb has no authentication: restrict to the operator's IP(s).
        # allow YOUR.STATIC.IP.HERE;
        # deny all;
        proxy_pass http://pgweb:8081;
        include /etc/nginx/proxy_params_qs;
    }

    location / {
        proxy_pass http://frontend:3000;
        include /etc/nginx/proxy_params_qs;
    }
}
