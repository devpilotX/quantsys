[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsdash"
version = "0.1.0"
description = "quantsys live dashboard & control plane: API, websocket hub, engine bridge"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "quantsys",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qsdash*"]
