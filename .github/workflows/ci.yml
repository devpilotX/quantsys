name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so dependency advisories and upstream library drift surface on a
    # cadence rather than only when someone happens to push.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"          # research results must not depend on hash order
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (pinned, see scripts/ci_install.sh)
        run: bash scripts/ci_install.sh 3.12
      - name: ruff (lint)
        run: python -m ruff check --output-format=github .
      - name: mypy
        run: python -m mypy

  shell:
    name: workflow + shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint (runs shellcheck on every run block)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: shellcheck (deploy and CI scripts)
        run: shellcheck deploy/scripts/*.sh scripts/*.sh

  test:
    name: test py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor; 3.14 is what the maintainer runs locally.
        # Both ends are tested because the numerical stack behaves differently
        # across them (numpy 2 dtype promotion, pandas 3 copy semantics).
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (pinned, see scripts/ci_install.sh)
        run: bash scripts/ci_install.sh ${{ matrix.python }}
      - name: Record the resolved dependency set
        # Printed on every run so a failure caused by upstream drift can be
        # diagnosed from the log alone. Pinned runs print the constraints
        # file; the weekly unpinned run is where a difference means something.
        run: |
          python -VV
          python -m pip freeze
      - name: pytest
        run: >
          python -m pytest tests
          -p no:cacheprovider
          --cov=quantsys --cov-report=term-missing --cov-report=xml
          -m "not network"
      - name: Enforce determinism (same seed, same result)
        # The engine claims bit-identical decisions from identical state. A
        # second run under a different hash seed must still agree.
        env:
          PYTHONHASHSEED: "12345"
        run: python -m pytest tests -q -p no:cacheprovider -m "not network"
      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  dashboard:
    name: dashboard backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install engine + dashboard backend
        working-directory: dashboard/backend
        run: |
          python -m pip install -e ../..
          python -m pip install -e ".[dev]"
      - name: pytest
        working-directory: dashboard/backend
        run: python -m pytest tests -q -p no:cacheprovider

  postgres:
    name: migrations + dashboard on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        # the image production runs (deploy/docker-compose.yml)
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: quantsys
          POSTGRES_PASSWORD: quantsys
          POSTGRES_DB: quantsys
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantsys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PG_URL: postgresql+psycopg://quantsys:quantsys@localhost:5432/quantsys
    defaults:
      run:
        working-directory: dashboard/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install engine + dashboard backend
        run: |
          python -m pip install -e ../..
          python -m pip install -e ".[dev]"
      - name: Migrate an empty database the way a deploy does, then diff it with the models
        # The dashboard suite builds its schema from the models, so a model
        # change without a migration passes every test and then fails on the
        # VPS. This runs the same command a deploy runs, on the same image.
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          python -m qsdash.cli init-db
          python scripts/check_migrations.py
      - name: Dashboard suite on Postgres
        # SQLite enforces neither foreign keys nor column lengths, and skips
        # NOTIFY; production does all three.
        env:
          QSDASH_TEST_DATABASE_URL: ${{ env.PG_URL }}
        run: python -m pytest tests -p no:cacheprovider

  frontend:
    name: frontend lint + types + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - run: npm run build

  images:
    name: docker images + first-deploy smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v7
      - name: Compose file is valid for every profile
        run: |
          cp .env.example .env
          docker compose --profile demo --profile paper --profile live config --quiet
      - name: Build the API/engine and frontend images
        # engine, engine-paper and engine-live build the same Dockerfile as api
        run: docker compose build api frontend
      - name: First deploy as docs/DEPLOY.md runs it
        run: |
          docker compose up -d postgres redis
          docker compose run --rm api python -m qsdash.cli init-db
          docker compose up -d api frontend
          ok=""
          for _ in $(seq 1 30); do
            if docker compose exec -T api python -c "import httpx; httpx.get('http://127.0.0.1:8000/api/health', timeout=4).raise_for_status()"; then ok=1; break; fi
            sleep 2
          done
          test -n "$ok"
          ok=""
          for _ in $(seq 1 30); do
            if docker compose exec -T frontend wget -qO /dev/null http://127.0.0.1:3000/login; then ok=1; break; fi
            sleep 2
          done
          test -n "$ok"
          echo "api healthy, frontend serving"
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          bash scripts/ci_install.sh 3.12
          python -m pip install -e dashboard/backend
      - name: pip-audit (engine + dashboard, full resolved environment)
        # Non-blocking: an advisory published upstream against a transitive dev
        # dependency should not break an unrelated pull request. It is still
        # surfaced in the run summary, and SECURITY.md defines the triage path.
        continue-on-error: true
        run: python -m pip_audit --progress-spinner=off --desc
      - name: npm audit (frontend runtime dependencies)
        continue-on-error: true
        working-directory: dashboard/frontend
        run: npm audit --package-lock-only --omit=dev --audit-level=high

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # gitleaks needs history to scan past commits
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  build:
    name: build + install from wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel into a clean venv and import it
        # Catches packaging mistakes that an editable install hides, such as a
        # missing package-data entry or a module left out of the wheel.
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install dist/*.whl
          /tmp/fresh/bin/python - <<'PY'
          import quantsys, quantsys.costs, quantsys.portfolio.sizing, quantsys.risk.engine
          from quantsys.backtest import run_backtest
          print("import OK", quantsys.__file__, run_backtest.__name__)
          PY
      - name: py.typed must ship in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "quantsys/py.typed" in names, names
          print("py.typed present in", wheel)
          PY

  ci-ok:
    # Single required status check, so branch protection does not need updating
    # every time the matrix changes.
    name: CI passed
    if: always()
    needs: [lint, shell, test, dashboard, postgres, frontend, images, audit, secrets, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"failure"'; then
            echo "a required job failed"; exit 1
          fi
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"cancelled"'; then
            echo "a required job was cancelled"; exit 1
          fi
          echo "all required jobs passed"
