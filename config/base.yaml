# quantsys base configuration.
# Every value here overrides the typed defaults in quantsys/config/schema.py.
# Tier ladder, risk limits, costs: see schema.py for the full documented set.
#
# 2026-07-02 FORWARD-STUDY UNLOCK (paper only — see docs/FORWARD_STUDY.md):
#   * universe broadened to 48 liquid large-caps + 2 index futures so the
#     Pillar-2 factor sleeve has real breadth (TATAMOTORS became TMPV/TMCV
#     after the 2025 demerger — the old symbol is gone from the master);
#   * factor + expiry sleeves enabled for the pre-registered forward paper
#     study (code defaults stay False; live arming stays gated by
#     QS_LIVE_ARMED + rotated credentials, unchanged);
#   * min-lot promotion ON so index futures can trade their 1-lot market
#     minimum inside an explicit risk ceiling;
#   * the paper float itself is operational state (durable runtime_config key
#     `paper_capital`; ₹15cr for the study so tier T6 unlocks 40 instruments
#     and all 4 strategy slots) — deliberately NOT a value in this file.
#
# NOTE ON MARKET DATA CONSTANTS (lot sizes, ADV, margins): sample values
# verified June 2026 (NIFTY lot 65, BANKNIFTY lot 30 per NSE Jan-2026
# revision). In live/paper runs the execution layer refreshes lot sizes,
# tokens and ADV daily from the Angel One instrument master; these entries are
# warm-start fallbacks, not authority. ADV for the 2026-07 additions = 90-day
# mean daily share volume from the local NSE bhavcopy panel (to 2026-06-19).

engine:
  decision_bar_minutes: 15
  index_symbol: NIFTY

sizing:
  base_risk_frac: 0.006          # 0.6% of equity at risk per unit trade
  max_signals_per_strategy: 40   # factor emits a 24-name basket; don't truncate it
  min_lot_promotion: true        # index-futures unlock (single-leg, risk-capped)
  promotion_max_risk_frac: 0.005

vol_target:
  annual_vol_target: 0.13

drawdown:
  daily_loss_limit: 0.025
  max_drawdown: 0.18
  kill_drawdown: 0.20

# Costs: verified June 2026 — Budget 2026 STT (futures 0.05%, options 0.15%)
# effective 2026-04-01; Angel One Rs 20/0.25% per order; re-verify quarterly.
costs:
  brokerage_flat: 20.0

# Paper forward-study sleeves. Code defaults keep both False; this file is the
# single switch that turns them on for the deployed paper engine.
factor:
  enabled: true
  min_universe: 34               # T6 view is 40 names; margin for history gaps
  top_k: 12                      # 12 long / 12 short, dollar-neutral
expiry:
  enabled: true

universe:
